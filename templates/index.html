<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Stream Companies Content Generator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Layout Styles -->
    <style>
        .code-snippet-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .code-box {
            width: 48%;
            box-sizing: border-box;
        }

        .code-box textarea {
            width: 100%;
            height: 400px;
            box-sizing: border-box;
        }

        @media (max-width: 900px) {
            .code-box {
                width: 100%;
            }
        }

        .editor-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px auto;
            width: 100%;
        }

        /* CKEditor maximize behavior */
        body.cke_maximized {
            padding-top: 0 !important;
            height: 100vh !important;
            overflow: hidden !important;
        }

        body.cke_maximized .banner {
            display: none !important;
        }

        body.cke_maximized .content {
            margin-top: 0 !important;
        }

        body.cke_maximized .cke {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 99999 !important;
        }

        body.cke_maximized .cke_contents {
            height: calc(100vh - 120px) !important;
        }

        body.cke_maximized textarea.cke_source {
            height: 100% !important;
            min-height: 100% !important;
            box-sizing: border-box !important;
        }
    </style>

    <!-- CKEditor -->
    <script src="https://cdn.ckeditor.com/4.21.0/full/ckeditor.js"></script>
</head>

<body>

    <!-- Header -->
    <div class="banner">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='Stream_Logo.png') }}" alt="Stream Companies Logo">
        </div>
        <h1>Stream Companies UPI (Content Generator)</h1>
    </div>

    <!-- Main Content -->
    <div class="content">

        <!-- UPI Logo -->
        <div style="display:flex;justify-content:center;align-items:center;margin-top:10px;">
            <img src="{{ url_for('static', filename='UPI_Logo.png') }}"
                 alt="Unpaid Intern Logo"
                 style="width:100px;height:100px;border-radius:50%;object-fit:cover;">
        </div>

        <h2>Hi! I'm your personal UPI</h2>

        <!-- Input Form -->
        <form method="POST">

            <!-- HTML Editor -->
            <div class="editor-container">
                <textarea id="html_content" name="html_content" placeholder="Paste your raw HTML here"></textarea>
            </div>

            <!-- Submit Button -->
            <div style="text-align:center;">
                <button class="button" type="submit"><strong>↑</strong></button>
            </div>

            <!-- Template Toggles -->
            <div class="toggle-row">
                <label class="switch-label">
                    <input type="checkbox" id="geo_toggle" name="geo_toggle">
                    <span class="slider"></span>
                    <div class="switch-text">Geolocation Template</div>
                </label>

                <label class="switch-label">
                    <input type="checkbox" id="mslp_toggle" name="mslp_toggle">
                    <span class="slider"></span>
                    <div class="switch-text">SRP/MSLP Template</div>
                </label>

                <label class="switch-label">
                    <input type="checkbox" id="single_image_toggle" name="single_image_toggle">
                    <span class="slider"></span>
                    <div class="switch-text">Single Image Template</div>
                </label>

                <label class="switch-label">
                    <input type="checkbox" id="single_banner_toggle" name="single_image_banner_toggle">
                    <span class="slider"></span>
                    <div class="switch-text">Single Image Template (Banner)</div>
                </label>

                <label class="switch-label">
                    <input type="checkbox" id="hubpage_toggle" name="hubpage_toggle">
                    <span class="slider"></span>
                    <div class="switch-text">Hubpage Template</div>
                </label>
            </div>

            <!-- Map Option -->
            <div class="map-check-row">
                <label class="map-check">
                    <input type="checkbox" id="map_outro_toggle" name="map_outro_toggle">
                    <span class="map-check__dot"></span>
                    <div class="switch-text">Outro w/Map</div>
                </label>
            </div>

        </form>

        <!-- Download Output -->
        {% if download_url %}
        <div class="download-container">
            <a class="download-button" href="{{ download_url }}" download>Download Output File</a>
        </div>
        {% endif %}

        <!-- Reference Snippets -->
        <div class="code-snippet-container">

            <div class="code-box">
                <h3>DealerOn map/contact form</h3>
                <textarea readonly>
<div class="row">
  <div class="col-md-12 col-md-6">
    <iframe src="https://www.example.com/fillermap" style="border:0;width:100%;height:650px;"></iframe>
  </div>
  <div class="col-md-12 col-md-6">
    #LOADCUSTOMFILE|Responsive|Production|Sidebar|Sidebar-Contact#
  </div>
</div>
                </textarea>
            </div>

            <div class="code-box">
                <h3>DealerInspire map/contact form</h3>
                <textarea readonly>
<div class="row">
  <div class="col-md-12 col-md-6">
    <iframe src="https://www.example.com/fillermap" style="border:0;width:100%;height:650px;"></iframe>
  </div>
  <div class="col-md-12 col-md-6">
    [gravityform id="3" title="true" description="true"]
  </div>
</div>
                </textarea>
            </div>

        </div>

    </div>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const editor = CKEDITOR.replace('html_content', {
                height: 200,
                width: 600,

                allowedContent: false,
                extraAllowedContent: 'h1 h2 h3 h4 h5 h6 p ul ol li strong em a[href] br',

                format_tags: 'p;h1;h2;h3;h4;h5;h6',
                autoParagraph: false,

                forcePasteAsPlainText: true,
                pasteFromWordRemoveFontStyles: true,
                pasteFromWordRemoveStyles: true,

                removeFormatAttributes: 'style,font,span',
                removeFormatTags: 'span',

                contentsCss: [
                    'data:text/css,' +
                    'body{background:#ffffff;color:#000;font-family:Arial,Helvetica,sans-serif;padding:12px;}' +
                    'h1{font-size:2em;}h2{font-size:1.6em;}h3{font-size:1.35em;}' +
                    'h4{font-size:1.15em;}h5{font-size:1em;}h6{font-size:.9em;}'
                ],

                removePlugins: 'elementspath,resize'
            });

            const toggles = [
                'geo_toggle',
                'mslp_toggle',
                'single_image_toggle',
                'single_banner_toggle',
                'hubpage_toggle'
            ];

            toggles.forEach(id => {
                document.getElementById(id).addEventListener('change', function () {
                    if (this.checked) {
                        toggles.forEach(otherId => {
                            if (otherId !== id) {
                                document.getElementById(otherId).checked = false;
                            }
                        });
                    }
                });
            });

        });
    </script>

</body>
</html>
