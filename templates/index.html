<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Stream Companies Content Generator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- CKEditor -->
    <script src="https://cdn.ckeditor.com/4.21.0/full/ckeditor.js"></script>

    <style>
        .editor-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px auto;
            width: 100%;
        }

        .cke_editor_html_content {
            margin: 0 auto;
        }

        .map-check-row {
            display: flex;
            justify-content: center;
            margin-top: 18px;
        }

        .map-check {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .map-check input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .map-check__dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.85);
            box-sizing: border-box;
        }

        .map-check input[type="checkbox"]:checked + .map-check__dot {
            background: #ca7149;
            border-color: #ca7149;
            box-shadow: 0 0 0 3px rgba(202, 113, 73, 0.35);
        }

        .code-snippet-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 40px auto;
            width: 95%;
            max-width: 1400px;
        }

        .code-box {
            position: relative;
            flex: 1 1 600px;
            max-width: 700px;
        }

        .code-box h3 {
            color: #f3793e;
            margin-bottom: 8px;
            text-align: center;
        }

        .code-box textarea {
            width: 100%;
            height: 400px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            background-color: #f9f9f9;
            color: #000;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: none;
        }

        .copy-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #ca7149;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="banner">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='Stream_Logo.png') }}" alt="Stream Companies Logo">
        </div>
        <h1>Stream Companies UPI (Content Generator)</h1>
    </div>

    <div class="content">

        <div style="display:flex;justify-content:center;margin-top:10px;">
            <img src="{{ url_for('static', filename='UPI_Logo.png') }}"
                 alt="Unpaid Intern Logo"
                 style="width:100px;height:100px;border-radius:50%;">
        </div>

        <h2>Hi! I'm your personal UPI</h2>

        <form method="POST">

            <div class="editor-container">
                <textarea id="html_content" name="html_content"></textarea>
            </div>

            <div style="text-align:center;">
                <button class="button" type="submit"><strong>↑</strong></button>
            </div>

            <div class="toggle-row">
                <label class="switch-label">
                    <input type="checkbox" name="geo_toggle">
                    <span class="slider"></span>
                    <div class="switch-text">Geolocation Template</div>
                </label>

                <label class="switch-label">
                    <input type="checkbox" name="mslp_toggle">
                    <span class="slider"></span>
                    <div class="switch-text">SRP / MSLP Template</div>
                </label>

                <label class="switch-label">
                    <input type="checkbox" name="single_image_toggle">
                    <span class="slider"></span>
                    <div class="switch-text">Single Image Template</div>
                </label>

                <label class="switch-label">
                    <input type="checkbox" name="hubpage_toggle">
                    <span class="slider"></span>
                    <div class="switch-text">Hubpage Template</div>
                </label>
            </div>

            <div class="map-check-row">
                <label class="map-check">
                    <input type="checkbox" name="map_outro_toggle">
                    <span class="map-check__dot"></span>
                    <div class="switch-text">Outro w/Map</div>
                </label>
            </div>

        </form>

        {% if download_url %}
        <div class="download-container">
            <a class="download-button" href="{{ download_url }}" download>Download Output File</a>
        </div>
        {% endif %}

        <!-- DealerOn / DealerInspire -->
        <div class="code-snippet-container">

            <div class="code-box">
                <h3>DealerOn Map / Contact</h3>
                <textarea readonly>
<div class="row">
  <div class="col-md-12 col-md-6">
    <iframe src="MAP_URL" style="width:100%;height:650px;border:0;"></iframe>
  </div>
  <div class="col-md-12 col-md-6">
    #LOADCUSTOMFILE|Responsive|Production|Sidebar|Sidebar-Contact#
  </div>
</div>
                </textarea>
            </div>

            <div class="code-box">
                <h3>DealerInspire Map / Contact</h3>
                <textarea readonly>
<div class="row">
  <div class="col-md-12 col-md-6">
    <iframe src="MAP_URL" style="width:100%;height:650px;border:0;"></iframe>
  </div>
  <div class="col-md-12 col-md-6">
    [gravityform id="3" title="true" description="true"]
  </div>
</div>
                </textarea>
            </div>

        </div>

    </div>

    <script>
        CKEDITOR.replace('html_content', {
            height: 200,
            width: 600,
            allowedContent: true,
            autoParagraph: false,
            removePlugins: 'elementspath,resize'
        });
    </script>

</body>
</html>
